<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost in the reeds — BirdScope</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f1e7;
      --ink: #1d2a23;
      --muted: #5c6b62;
      --primary: #1f5e4b;
      --accent: #c96f43;
      --line: #ded5c6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 15%, rgba(201, 111, 67, 0.12), transparent 32rem),
        radial-gradient(circle at 85% 80%, rgba(31, 94, 75, 0.14), transparent 34rem),
        var(--bg);
      color: var(--ink);
      font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .card {
      width: min(560px, 100%);
      padding: 40px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255, 253, 248, 0.9);
      box-shadow: 0 24px 70px rgba(35, 48, 40, 0.12);
      text-align: center;
    }
    img { width: 64px; height: 64px; }
    p.eyebrow {
      margin: 18px 0 6px;
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 7vw, 3rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }
    p.copy { margin: 14px auto 26px; max-width: 38ch; color: var(--muted); line-height: 1.65; }
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 22px;
      border-radius: 999px;
      background: var(--primary);
      color: #fffdf8;
      font-weight: 650;
      text-decoration: none;
    }
    a.button:hover { background: #174a3a; }
    small { display: block; margin-top: 18px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <img src="assets/logo.svg" alt="" width="64" height="64">
    <p class="eyebrow">404 · Off the trail</p>
    <h1>Lost in the reeds</h1>
    <p class="copy">This page does not exist. The birds are still out there — head back to the field guide and start with a place.</p>
    <a class="button" href="./">Back to BirdScope</a>
    <small>BirdScope · a location-aware field guide</small>
  </main>
</body>
</html>
